<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1433">
<title>Sign in – Nifty Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    DEMO LOGIN ONLY. This page runs entirely in the browser, so it keeps casual
    visitors out but is NOT real security: anyone can read the source or open
    data.json directly. Change the credentials below:
      USERNAME  – plain text
      PASS_HASH – SHA-256 of the password. Generate one in a browser console:
        crypto.subtle.digest('SHA-256', new TextEncoder().encode('newpass'))
          .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
  */
  :root { --space:#0E1433; --panel:#171F4A; --line:#2A3570; --ion:#45D8FF; --bear:#FF5C7A; --txt:#E8ECFF; --mut:#8E98C8;
          --chamfer:polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; font:15px/1.55 'Sora', system-ui, sans-serif; color:var(--txt);
         background:var(--space);
         background-image:radial-gradient(900px 500px at 70% 0%, rgba(69,216,255,.18), transparent 60%),
           radial-gradient(800px 500px at 0% 100%, rgba(164,139,255,.14), transparent 60%),
           linear-gradient(rgba(69,216,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(69,216,255,.04) 1px, transparent 1px);
         background-size:auto, auto, 44px 44px, 44px 44px; }
  .card { width:100%; max-width:380px; clip-path:var(--chamfer); padding:30px 28px 26px;
          background:linear-gradient(150deg, rgba(69,216,255,.14), var(--panel) 45%); }
  .brand { font:700 24px 'Chakra Petch', sans-serif; letter-spacing:.04em; margin:0; }
  .brand span { color:var(--ion); }
  .sub { color:var(--mut); font-size:14px; margin:4px 0 24px; }
  label { display:block; font-size:13px; color:var(--mut); margin:0 0 6px; }
  input[type=text], input[type=password] { width:100%; padding:11px 12px; border-radius:6px; border:1px solid var(--line); background:rgba(14,20,51,.7);
         color:var(--txt); font:16px 'Sora', sans-serif; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--ion); box-shadow:0 0 0 3px rgba(69,216,255,.2); }
  .row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mut); margin:-4px 0 20px; }
  .row input { accent-color:var(--ion); }
  button { width:100%; padding:12px; border:0; border-radius:6px; cursor:pointer; font:600 16px 'Chakra Petch', sans-serif; letter-spacing:.05em;
           color:#06202B; background:var(--ion); box-shadow:0 0 24px rgba(69,216,255,.35); }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .err { min-height:22px; color:var(--bear); font-size:13px; margin:10px 0 0; }
  .demo { margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--mut); }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1 class="brand">NIFTY<span>/</span>COCKPIT</h1>
  <p class="sub">Sign in to see today's analysis</p>
  <label for="u">Username</label>
  <input type="text" id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="row"><input type="checkbox" id="rem"> Keep me signed in on this device</label>
  <button type="submit">Sign in</button>
  <p class="err" id="err" role="alert"></p>
  <p class="demo">Demo login. It keeps casual visitors out but isn't real security.</p>
</form>
<script>
const USERNAME = 'admin';
const PASS_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'; // admin123

if (sessionStorage.getItem('nc_auth') === '1' || localStorage.getItem('nc_auth') === '1') location.replace('index.html');

async function sha256(t) {
  if (!window.crypto || !crypto.subtle) return null;   // needs https or localhost
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
  const h = await sha256(p), err = document.getElementById('err');
  if (h === null) { err.textContent = 'Open this page over https (or localhost) to sign in.'; return; }
  if (u === USERNAME && h === PASS_HASH) {
    sessionStorage.setItem('nc_auth', '1');
    if (document.getElementById('rem').checked) localStorage.setItem('nc_auth', '1');
    location.replace('index.html');
  } else {
    err.textContent = 'Wrong username or password. Try again.';
    document.getElementById('p').value = ''; document.getElementById('p').focus();
  }
};
</script>
</body>
</html>
